# Front door: serves the built frontend (SPA) and reverse-proxies the API.
#
#   /                      -> static SPA (index.html fallback for client routes)
#   /api/jobs/<id>/events  -> Server-Sent Events, unbuffered, long-lived
#   /api/...               -> gunicorn/flask web tier
#   /audit, /jobs, /health -> legacy API routes (deprecated aliases)

upstream audit_backend {
    # `audit` is the compose service name; Docker's embedded DNS resolves it.
    server audit:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Payloads are small JSON; graphs come back from the upstream. Cap the body
    # to keep obviously-bad requests cheap.
    client_max_body_size 1m;

    # Requests are short — the long crawl runs in the worker, off the request
    # path. Only the SSE location below holds a connection open.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    proxy_http_version    1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # --- live progress (SSE): never buffer, allow long reads -----------------
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://audit_backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        # Buffer the (potentially large) graph response through to the client.
        proxy_buffering on;
        proxy_pass http://audit_backend;
    }

    # --- legacy API routes (deprecated; kept for existing clients) -----------
    location = /health { proxy_pass http://audit_backend; access_log off; }
    location = /audit  { proxy_pass http://audit_backend; }
    location = /jobs   { proxy_pass http://audit_backend; }
    location /jobs/    { proxy_pass http://audit_backend; }

    # --- SPA ------------------------------------------------------------------
    # Hashed build assets never change: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Client-side routes (/audits/<id>, /view, ...) fall back to the app.
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
