# Reverse proxy fronting the gunicorn audit harness.

upstream audit_backend {
    # `audit` is the compose service name; Docker's embedded DNS resolves it.
    server audit:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Payloads are small JSON; graphs come back from the upstream. Cap the body
    # to keep obviously-bad requests cheap.
    client_max_body_size 1m;

    # Requests are short now (submit/poll/result) — the long crawl runs in the
    # worker, off the request path. Modest timeouts suffice.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Buffer the (potentially large) graph response through to the client.
    proxy_buffering on;

    location /health {
        proxy_pass http://audit_backend;
        access_log off;
    }

    location / {
        proxy_pass http://audit_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
