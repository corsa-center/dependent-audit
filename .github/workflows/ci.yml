name: CI

# Runs on every PR targeting main, plus pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the crawler's minimum (tomllib); keep it first.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Install deps
        # The crawler needs requests (project deps); the service HTTP tests
        # add flask per-invocation via `--with flask`.
        run: uv sync

      - name: Identifier-set / discovery tests
        run: uv run pytest tests/test_identifier_set.py

      - name: Progress-event tests (crawler emitter + option-spec drift)
        run: uv run pytest tests/test_progress_events.py

      - name: Service harness tests (mapping + job store)
        run: uv run pytest deploy/service/tests/test_auditlib.py

      - name: Service event-log + worker tests
        run: uv run pytest deploy/service/tests/test_events.py

      - name: Service HTTP/SSE tests
        run: uv run --with flask pytest deploy/service/tests/test_app.py

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Generated schema types are up to date
        run: npm run gen:types && git diff --exit-code -- src/api/udg.generated.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-endpoint:
    name: Docker endpoint (compose + nginx + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (CI overlay = fake crawler, no tokens)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/ci/docker-compose.ci.yml \
            up -d --build

      - name: Smoke-test the endpoint through nginx
        run: bash deploy/ci/smoke_test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml down -v
      
  lint:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      
      - run: uv sync --all-extras --dev

      - name: Lint 
        run: |
          uv run ruff format --check .
