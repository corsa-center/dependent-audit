name: Build package 

# Runs on every PR targeting main, plus pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ### Build wheel
  build-package:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Build artifact
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  test-package:
    name: Integration Tests
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Install wheel and deps
        run: |
          uv venv
          uv pip install dist/*.whl pytest

      - name: Test wheel
        run: |
          mkdir test_env
          cd test_env
          uv run pytest ../tests
          uv run pytest ../deploy/service/tests/